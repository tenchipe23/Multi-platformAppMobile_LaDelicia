<ion-header [translucent]="true">
  <ion-toolbar color="warning">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Mi perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mi Perfil</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Loading state -->
  <div *ngIf="loading" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <!-- User profile section -->
  <div class="profile-header" *ngIf="!loading">
    <ion-avatar class="profile-photo">
      <img [src]="photo || '../../../assets/img/usuario.png'" alt="Foto del usuario" />
      <ion-icon name="camera" class="camera-icon" (click)="changePhoto()"></ion-icon>
    </ion-avatar>
    <ion-button expand="block" fill="solid" color="warning" (click)="openEditModal()">
      Editar Perfil <ion-icon slot="end" name="create-outline"></ion-icon>
    </ion-button>
  </div>

  <!-- User information -->
  <div class="user-info" *ngIf="!loading && user">
    <ion-card>
      <ion-card-content>
        <ion-item>
          <ion-label>Username:</ion-label>
          <ion-text slot="end">{{ authData.username }}</ion-text>
        </ion-item>
        <ion-item>
          <ion-label>Nombre:</ion-label>
          <ion-text slot="end">{{user.name || 'N/A'}}</ion-text>
        </ion-item>
        <ion-item>
          <ion-label>Primer Apellido:</ion-label>
          <ion-text slot="end">{{user.first_surname || 'N/A'}}</ion-text>
        </ion-item>
        <ion-item>
          <ion-label>Segundo Apellido:</ion-label>
          <ion-text slot="end">{{user.last_surname || 'N/A'}}</ion-text>
        </ion-item>
        <ion-item>
          <ion-label>Email:</ion-label>
          <ion-text slot="end">{{ authData.email }}</ion-text>
        </ion-item>
        <ion-item>
          <ion-label>Teléfono:</ion-label>
          <ion-text slot="end">{{user.phone_number || 'No disponible'}}</ion-text>
        </ion-item>
        <!-- <ion-item> -->
          <!-- <ion-label>Codigo postal:</ion-label>
          <ion-text slot="end">{{user.postal_code || 'N/A'}}</ion-text>
        </ion-item>
        <ion-item>
          <ion-label>Dirección:</ion-label>
          <ion-text slot="end">{{user.address || 'N/A'}}</ion-text>
        </ion-item>
        <ion-item>
          <ion-label>Fecha de nacimiento:</ion-label>
          <ion-text slot="end">{{user.date_of_birth || 'N/A'}}</ion-text>
        </ion-item>
        <ion-item>
          <ion-label>Ciudad:</ion-label>
          <ion-text slot="end">{{user.city || 'N/A'}}</ion-text>
        </ion-item> -->
      </ion-card-content>
    </ion-card>
  </div>

  <!-- Logout button -->
  <div class="logout-section">
    <ion-button 
      expand="block" 
      color="danger" 
      fill="outline" 
      (click)="logout()">
      Cerrar Sesión
    </ion-button>
  </div>
</ion-content>
