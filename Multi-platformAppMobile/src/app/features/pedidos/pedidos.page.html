<app-header [titulo]="titulo"></app-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Pedidos</ion-title>
    </ion-toolbar>
  </ion-header>

  <h1 class="page-title">📦 Mis Pedidos</h1>

  <div *ngIf="orders.length === 0" class="empty-orders">
    <ion-icon name="cart-outline" class="icon-large"></ion-icon>
    <h2>Aún no hay pedidos</h2>
    <p>Cuando realices un pedido, aparecerá aquí.</p>
  </div>

  <ion-list *ngIf="orders.length > 0" class="order-list">
    <ion-card *ngFor="let order of orders" (click)="goToOrderDetail(order.id)" class="order-card">
      <ion-card-header class="card-header">
        <ion-icon name="receipt-outline" class="order-icon"></ion-icon>
        <ion-card-title>Orden #{{ order.id }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>
          <strong>Estado: </strong>
          <ion-badge [ngClass]="{
            'pending-status': order.status === 'pendiente',
            'ready-status': order.status === 'listo para recoger',
            'canceled-status': order.status === 'cancelado'
          }">
            {{ order.status }}
          </ion-badge>
        </p>
        <p><ion-icon name="cash-outline"></ion-icon> <strong>Total:</strong> ${{ order.total }}</p>
        <p><ion-icon name="card-outline"></ion-icon> <strong>Método de Pago:</strong> Efectivo</p>
        <!-- <p><ion-icon name="person-outline"></ion-icon> <strong>Cliente:</strong> {{ userName }}</p> -->
      </ion-card-content>
    </ion-card>
  </ion-list>

  <ion-infinite-scroll>
    <ion-infinite-scroll-content loadingSpinner=""></ion-infinite-scroll-content>
  </ion-infinite-scroll>

  <app-tab-bar></app-tab-bar>
</ion-content>
