<ion-header [translucent]="true">
  <ion-toolbar color="warning">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Carrito</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- Lista de productos en el carrito -->
  <ion-list *ngIf="carrito.length > 0" class="cart-list">
    <ion-item *ngFor="let item of carrito" class="cart-item">
      <ion-thumbnail slot="start" class="product-thumbnail">
        <img [src]="item.image" alt="{{ item.name_product }}" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ item.name_product }}</h2>
        <p class="price">{{ item.price_product | currency }}</p>
        <div class="quantity-controls">
          <ion-button fill="clear" (click)="decreaseQuantity(item)" [disabled]="item.quantity <= 1">
            <ion-icon name="remove-circle-outline"></ion-icon>
          </ion-button>
          <span class="quantity-value">{{ item.quantity }}</span>
          <ion-button fill="clear" (click)="increaseQuantity(item)" [disabled]="item.quantity >= item.stock">
            <ion-icon name="add-circle-outline"></ion-icon>
          </ion-button>
        </div>
      </ion-label>
      <ion-button fill="clear" color="danger" (click)="confirmarEliminacion(item)">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <!-- Total del carrito -->
  <div class="cart-total" *ngIf="carrito.length > 0">
    <h3>Total:</h3>
    <p>{{ total | currency }}</p>
  </div>

  <!-- Botón de compra -->
  <ion-button *ngIf="carrito.length > 0" expand="block" color="warning" (click)="crearOrden()" class="checkout-button">
    <ion-icon name="bag-check-outline" slot="start"></ion-icon>
    Continuar con la compra
  </ion-button>

  <!-- Mensaje si el carrito está vacío -->
  <div *ngIf="carrito.length === 0" class="empty-cart">
    <ion-icon name="cart-outline"></ion-icon>
    <h2>¡Tu carrito está vacío!</h2>
    <p>Explora nuestros productos y agrega lo que necesitas.</p>
    <ion-button expand="full" routerLink="/productos">Ver Productos</ion-button>
  </div>

</ion-content>
